<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cortis Quiz</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #f8cdda, #1d2b64);
    color: #fff;
    display: flex;
    justify-content: center;
    padding: 50px;
  }

  .container {
    width: 400px;
    background-color: rgba(0,0,0,0.5);
    padding: 20px;
    border-radius: 15px;
    text-align: center;
  }

  button {
    padding: 10px 20px;
    margin: 10px 5px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background-color: #ff69b4;
    color: #fff;
    font-weight: bold;
  }

  button:hover {
    background-color: #ff85c1;
  }

  #result {
    margin-top: 20px;
    font-size: 18px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Cortis Quiz</h1>
  <div id="quiz">
    <p>Qual é o seu estilo de fã do Cortis?</p>
    <button onclick="choose('Dance Machine')">Dance Machine</button>
    <button onclick="choose('Vocal Star')">Vocal Star</button>
    <button onclick="choose('Visual Lover')">Visual Lover</button>
  </div>
  <div id="result"></div>
</div>

<script>
function choose(answer) {
  const result = document.getElementById('result');
  if(answer === 'Dance Machine') {
    result.innerHTML = "Você adora as coreografias e acompanha todos os movimentos do Cortis!";
  } else if(answer === 'Vocal Star') {
    result.innerHTML = "Você é apaixonado(a) pelas vozes incríveis dos membros e cada nota te emociona!";
  } else if(answer === 'Visual Lover') {
    result.innerHTML = "Você ama o estilo e visual dos membros, cada foto é perfeita!";
  }
  document.getElementById('quiz').style.display = 'none';
}
</script>

</body>
</html>
